apiVersion: v1
kind: Secret
metadata:
  name: sec-dbm-accounting-app
  namespace: dbm-accounting
type: Opaque
stringData:
  DATABASE_URL: "postgres://replace-user:replace-password@replace-host/replace-db?sslmode=require"
  JWT_ACCESS_SECRET: "replace-with-long-random-access-secret"
  JWT_REFRESH_SECRET: "replace-with-long-random-refresh-secret"
  SESSION_SECRET: "replace-with-long-random-session-secret"
  CSRF_SECRET: "replace-with-long-random-csrf-secret"
